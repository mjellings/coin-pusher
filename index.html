<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0610" />
    <title>Coin Pusher</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="panel counter" id="bank-panel">
        <span class="label">Coins</span>
        <span class="value" id="bank">0</span>
      </div>
      <div class="panel counter" id="won-panel">
        <span class="label">Won</span>
        <span class="value" id="won">0</span>
      </div>
    </div>

    <div id="controls">
      <button class="panel control" id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" /></svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" /></svg>
      </button>
      <button class="panel control" id="quality" type="button" aria-label="Graphics quality">
        <span class="label">Quality</span>
        <span class="quality-value">High</span>
      </button>
    </div>

    <div id="popups" aria-live="polite"></div>
    <div id="hint">Move to aim, click or tap to drop a coin</div>
    <button id="refill" type="button" hidden>Out of coins! Get 20 more</button>
    <div id="loading"><span>Loading</span></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
